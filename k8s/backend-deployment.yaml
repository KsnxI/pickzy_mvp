
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickzy-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pickzy-backend
  template:
    metadata:
      labels:
        app: pickzy-backend
    spec:
      containers:
        - name: backend
          image: pickzy_mvp-backend:health-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: pickzy-config
            - secretRef:
                name: pickzy-secret

